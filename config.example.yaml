# Copy to config.yaml
# Every field is optional; omitted fields fall back to the defaults in core/config.py.

# Which domain profile to load (file name in profiles/, without .yaml).
profile: generic

# Contact email enables CrossRef/PubMed "polite pools" and Unpaywall lookups.
contact_email: ""
use_unpaywall: false

# Optional free API keys (raise rate limits / reliability).
api_keys:
  openalex: ""
  semantic_scholar: ""
  ncbi: ""

search:
  max_results_per_query: 10
  max_queries_per_run: 12
  concurrent_workers: 8
  timeout_seconds: 20
  enabled_sources: [openalex, crossref, pubmed, europepmc, semantic_scholar]
  semantic_scholar_max_queries_without_key: 0  # anonymous S2 is rate-limited hard
  # Optional per-stage HTTP overrides (advanced):
  # stage names include: openalex, crossref, europepmc, semantic_scholar,
  # unpaywall, pubmed_esearch, pubmed_efetch
  source_http_overrides: {}
  # Example:
  # source_http_overrides:
  #   semantic_scholar:
  #     max_attempts: 4
  #     backoff_base_seconds: 0.25
  #     backoff_max_seconds: 1.5
  #     retryable_status_codes: [429, 500, 502, 503, 504]

selection:
  enabled: true
  top_n: 25
  min_relevance: 30.0

# Run mode. Leave this alone for a local install: "local" means no accounts, no
# network dependency, and profile writes available to whoever is at the keyboard.
# "hosted" is set only by the deployment that runs bierre-ca alongside this app —
# it turns on the /accounts proxy, verifies access tokens, and makes profile
# writes require a signed-in caller. A hosted deployment sets
# profile_repository.mode: remote in the same file.
deployment:
  mode: local              # local | hosted
  accounts_base: /accounts # path the front-end proxies to bierre-ca (hosted only)
  auth_methods: [password] # rendered as sign-in buttons; a method absent here gets no button
  token_issuer: https://bierre.ca/accounts
  token_audience: bierre-api
